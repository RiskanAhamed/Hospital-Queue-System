server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_queue_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# BUG 33 FIX: Secret is read exclusively from the JWT_SECRET environment variable.
# No hardcoded fallback — the app will fail to start if JWT_SECRET is not set,
# which is intentional: a missing secret is better than a publicly-known one.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS & Security
# BUG 30 FIX: Explicit trusted frontend origins (used by SecurityConfig).
# Add http://localhost:5500 for VS Code Live Server (web-admin) and adjust as needed for deployment.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5500}

# Logging
logging.level.com.hospital.queue=DEBUG
logging.level.org.springframework.security=INFO
