server.port=${PORT:8080}
server.address=0.0.0.0

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:${MONGO_URL:${MONGO_URI:${MONGODB_URL:${DATABASE_URL:mongodb://localhost:27017/hospital_queue_db}}}}}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:AntiGravityHospitalQueueSuperSecretKey2026!HS256SecureKey}
app.jwt.expiration-ms=86400000

# CORS & Security
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5500,https://*,http://*}

# Logging
logging.level.com.hospital.queue=DEBUG
logging.level.org.springframework.security=INFO
